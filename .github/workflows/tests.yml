name: tests

# Audits, installs and tests every formula in this tap on macOS and Linux.
# The "brew" jobs are required checks on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brew:
    name: brew (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit
        run: brew audit --strict --online --tap meeting-ai/tap

      - name: Install and test every formula
        run: |
          set -euo pipefail
          for f in "$(brew --repo meeting-ai/tap)"/Formula/*.rb; do
            name="meeting-ai/tap/$(basename "$f" .rb)"
            brew install --formula "$name"
            brew test "$name"
          done
